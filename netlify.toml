[build]
  command = "npm run build"
  publish = "dist"

# La app solo habla con su propio origen, con Supabase y con Google Fonts.
# 'unsafe-inline' en style-src es necesario porque los colores de rubro se
# aplican con style={{...}} inline desde React.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self' 'unsafe-inline'; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com; \
      img-src 'self' data:; \
      connect-src 'self' https://anlfqnjbacqfcejojvxa.supabase.co wss://anlfqnjbacqfcejojvxa.supabase.co; \
      frame-ancestors 'none'; \
      base-uri 'self'; \
      form-action 'self'\
    """
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# El service worker no debe quedar cacheado: es el que decide qué se cachea.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Los assets llevan hash en el nombre: se pueden cachear para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
